<h1>Reactive Form</h1>

<h3>Form Control</h3>
<input type="text" [formControl]="formName" />

<h3>Form Array</h3>
<input type="button" (click)="addControls()" value="Add Control" />
@for (controls of formArray.controls; track $index) {
  <input type="text" [formControl]="controls" />
}

<h3>Form Group</h3>
<form [formGroup]="form" (ngSubmit)="onSubmit()">
  Name: <input type="text" formControlName="name" /> <br />
  Email: <input type="text" formControlName="email" /> <br />
  Address:
  <div formArrayName="address">
    @for (addressGroup of addressControl.controls; track addressGroup; let i = $index) {
      <div
        [formGroupName]="i"
        >
        <input formControlName="street" placeholder="Street" /> <br />
        <input formControlName="city" placeholder="City" /> <br />
        <input formControlName="country" placeholder="Country" /> <br />
      </div>
    }
  </div>

  <button type="submit">Submit</button>
</form>
